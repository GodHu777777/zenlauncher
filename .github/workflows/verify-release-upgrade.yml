name: Verify Signed Release Upgrade

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-release-upgrade.yml'
      - 'scripts/verify-release-upgrade.py'
      - 'app/**'
      - '*.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew*'
  workflow_dispatch:

# This workflow builds evidence only. It never creates or replaces a release/tag.
permissions:
  contents: read

concurrency:
  group: release-upgrade-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare Verified Signed Release Pair
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout Exact Candidate Commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Required Android Build Tools
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0"'

      - name: Download and Verify Immutable Old Release
        shell: bash
        run: |
          mkdir -p build/release-upgrade-apks build/release-upgrade-build
          # Official GitHub v2.1.3 asset digest, independently downloaded and checked
          # with aapt/apksigner (4,893,836 bytes, code 213, permanent V1/V2 signature).
          # The handoff's locally built APK has a different hash; do not substitute it.
          url=https://github.com/GodHu777777/zenlauncher/releases/download/v2.1.3/ZenLauncher-v2.1.3-native.apk
          expected=6d892040ddfe6c34fc3caba336d2d98fd24b154be487681ba8aabbaefb55be5b
          curl --fail --location --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --retry 3 --connect-timeout 20 --max-time 180 \
            --output build/release-upgrade-apks/old-release.apk "$url"
          printf '%s  %s\n' "$expected" build/release-upgrade-apks/old-release.apk | sha256sum --check
          printf '%s\n' "$url" > build/release-upgrade-build/old-release-url.txt

      - name: Build Candidate Release with Permanent Keystore
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --stacktrace 2>&1 | tee build/release-upgrade-build/gradle-release.log
          cp app/build/outputs/apk/release/app-release.apk build/release-upgrade-apks/new-release.apk

      - name: Verify Actual APK Versions and Signatures
        shell: bash
        run: |
          python3 -B - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import runpy
          import subprocess

          verifier = runpy.run_path('scripts/verify-release-upgrade.py')
          inspect = verifier['inspect_apk']
          require = verifier['require']
          directory = Path('build/release-upgrade-apks')
          tools = Path(os.environ['ANDROID_HOME']) / 'build-tools/34.0.0'
          old = inspect(directory / 'old-release.apk', tools / 'aapt', tools / 'apksigner')
          new = inspect(directory / 'new-release.apk', tools / 'aapt', tools / 'apksigner')
          require(old['sha256'] == '6d892040ddfe6c34fc3caba336d2d98fd24b154be487681ba8aabbaefb55be5b',
                  'Old APK differs from the pinned original v2.1.3 release')
          require(old['version_code'] == 213 and old['version_name'] == '2.1.3',
                  'Old APK metadata does not match the pinned release')
          require(new['version_code'] > old['version_code'],
                  'Candidate versionCode must strictly increase: a reinstall is not an upgrade')
          require(new['certificate_sha256'] == old['certificate_sha256'], 'APK certificates differ')
          require(max(old['min_sdk'], new['min_sdk']) <= 24, 'Both APKs must support API 24 and API 34')
          commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          require(commit == os.environ['GITHUB_SHA'], 'Checkout does not match this workflow commit')
          report = {
              'candidate_commit': commit,
              'workflow_run': os.environ['GITHUB_SERVER_URL'] + '/' + os.environ['GITHUB_REPOSITORY']
                              + '/actions/runs/' + os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'old_release_url': Path('build/release-upgrade-build/old-release-url.txt').read_text().strip(),
              'old_apk': old,
              'new_apk': new,
              'published': False,
          }
          (directory / 'provenance.json').write_text(json.dumps(report, indent=2) + '\n')
          # Pin the bytes transferred to each fresh emulator job, including provenance.
          files = ('old-release.apk', 'new-release.apk', 'provenance.json')
          (directory / 'SHA256SUMS').write_text(''.join(
              hashlib.sha256((directory / name).read_bytes()).hexdigest() + '  ' + name + '\n'
              for name in files))
          print(json.dumps(report, indent=2))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f"Candidate `{commit}`: signed Release {old['version_name']} "
                            f"({old['version_code']}) → {new['version_name']} ({new['version_code']}).\n\n"
                            f"Candidate SHA-256: `{new['sha256']}`.\n\n"
                            'Both APKs passed V1/V2 and permanent-certificate verification. '
                            'The candidate is a workflow artifact; published versions are untouched.\n')
          PY

      - name: Upload Verified APK Pair
        uses: actions/upload-artifact@v4
        with:
          name: signed-release-upgrade-apks
          path: build/release-upgrade-apks/
          if-no-files-found: error
          retention-days: 14

      - name: Upload Build Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signed-release-upgrade-build-evidence
          path: |
            build/release-upgrade-build/
            build/release-upgrade-apks/provenance.json
            build/release-upgrade-apks/SHA256SUMS
          if-no-files-found: warn
          retention-days: 14

  upgrade:
    name: Signed Release Upgrade (API ${{ matrix.api-level }})
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        api-level: [24, 34]
    steps:
      - name: Checkout Exact Verification Script
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Required Android Build Tools
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "build-tools;34.0.0"'

      - name: Download Verified Release Pair from This Run
        uses: actions/download-artifact@v4
        with:
          name: signed-release-upgrade-apks
          path: build/release-upgrade-apks

      - name: Verify Transferred APK Bytes
        working-directory: build/release-upgrade-apks
        run: sha256sum --check SHA256SUMS

      - name: Enable and Require KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle --timeout=10
          for attempt in {1..10}; do
            if [[ -r /dev/kvm && -w /dev/kvm ]]; then
              exit 0
            fi
            sleep 1
          done
          echo '::error::KVM is not readable and writable; this upgrade verification requires hardware acceleration.'
          ls -l /dev/kvm || true
          id
          exit 1

      - name: Prepare Upgrade Runner and Evidence Capture
        shell: bash
        run: |
          mkdir -p build/release-upgrade-evidence build/device-verification
          cat > build/run-release-upgrade.sh <<'BASH'
          #!/usr/bin/env bash
          set -euo pipefail
          evidence=build/release-upgrade-evidence
          logcat_pid=
          report_runner_failure() {
            local runner_exit=$1 runner_line=$2 failed_command=$3
            failed_command="${failed_command//%/%25}"
            failed_command="${failed_command//$'\n'/%0A}"
            echo "::error title=Release upgrade runner command::Line $runner_line exited $runner_exit: $failed_command"
            return "$runner_exit"
          }
          collect_evidence() {
            local status=$?
            trap - EXIT ERR
            set +e
            timeout 15s adb shell dumpsys activity activities > "$evidence/activity.txt" 2>&1
            timeout 15s adb shell dumpsys window windows > "$evidence/window.txt" 2>&1
            timeout 15s adb shell dumpsys window displays > "$evidence/displays.txt" 2>&1
            timeout 15s adb shell dumpsys package com.zenlauncher.app > "$evidence/package.txt" 2>&1
            timeout 15s adb logcat -d -v threadtime > "$evidence/logcat-final.txt" 2>&1
            timeout 15s adb exec-out screencap -p > "$evidence/final-screen.png" 2> "$evidence/screencap.log"
            if [[ -n "$logcat_pid" ]]; then
              kill "$logcat_pid" 2>/dev/null
              wait "$logcat_pid" 2>/dev/null
            fi
            exit "$status"
          }
          trap collect_evidence EXIT
          trap 'report_runner_failure "$?" "$LINENO" "$BASH_COMMAND"' ERR
          trap 'exit 143' TERM
          trap 'exit 130' INT
          adb logcat -c
          adb logcat -v threadtime > "$evidence/logcat.txt" 2>&1 &
          logcat_pid=$!
          adb shell getprop > "$evidence/device-properties.txt"
          if [[ -r "$ANDROID_HOME/emulator/source.properties" ]]; then
            cp "$ANDROID_HOME/emulator/source.properties" "$evidence/emulator-source.properties"
          fi
          # No instrumentation/debug installation or cached AVD is used in this job.
          # The verifier rejects any existing package or retained data before mutation.
          python3 -B scripts/verify-release-upgrade.py \
            --old-apk build/release-upgrade-apks/old-release.apk \
            --new-apk build/release-upgrade-apks/new-release.apk \
            --aapt "$ANDROID_HOME/build-tools/34.0.0/aapt" \
            --apksigner "$ANDROID_HOME/build-tools/34.0.0/apksigner" \
            --output build/device-verification/release-upgrade.json \
            2>&1 | tee "$evidence/verification.log"
          BASH

      - name: Verify Upgrade on a Fresh KVM Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          avd-name: release_upgrade_api_${{ matrix.api-level }}
          force-avd-creation: true
          cores: 2
          ram-size: 2048M
          emulator-boot-timeout: 300
          disable-linux-hw-accel: false
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -wipe-data -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none -accel on > '${{ github.workspace }}/build/release-upgrade-evidence/emulator.log' 2>&1
          script: bash build/run-release-upgrade.sh

      - name: Summarize Actual Upgrade Result
        if: always()
        env:
          EXPECTED_API: ${{ matrix.api-level }}
        shell: bash
        run: |
          python3 -B - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path('build/device-verification/release-upgrade.json')
          report = json.loads(path.read_text()) if path.exists() else {}
          success = report.get('success') is True and report.get('sdk') == int(os.environ['EXPECTED_API'])
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f"API {os.environ['EXPECTED_API']} Release upgrade: **{'PASS' if success else 'FAIL'}**.\n\n")
              for check in report.get('checks', []):
                  summary.write(f'- {check}\n')
              if not success:
                  summary.write('\n' + report.get('error', 'No successful verification report for the expected API.') + '\n')
          if not success:
              raise SystemExit('A successful Release upgrade report for this API is required.')
          PY

      - name: Upload Upgrade Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signed-release-upgrade-api-${{ matrix.api-level }}-evidence
          path: |
            build/release-upgrade-evidence/
            build/device-verification/
            build/release-upgrade-apks/provenance.json
            build/release-upgrade-apks/SHA256SUMS
          if-no-files-found: warn
          retention-days: 14
