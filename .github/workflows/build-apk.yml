name: Validate and Build Native Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zenlauncher-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test, Lint and Build Signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
      apk: ${{ steps.version.outputs.apk }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read Release Version from Gradle
        id: version
        shell: bash
        run: |
          chmod +x ./gradlew
          metadata="$(./gradlew -q :app:printReleaseMetadata)"
          version="$(printf '%s\n' "$metadata" | sed -n 's/^VERSION_NAME=//p')"
          code="$(printf '%s\n' "$metadata" | sed -n 's/^VERSION_CODE=//p')"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$code" =~ ^[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "apk=ZenLauncher-v${version}-native.apk" >> "$GITHUB_OUTPUT"
          echo "Building version $version ($code)" >> "$GITHUB_STEP_SUMMARY"

      - name: Run Navigation Regression Tests and Android Lint
        run: ./gradlew testDebugUnitTest lintDebug --stacktrace

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify Signing Certificate and V1/V2 Signatures
        shell: bash
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          apksigner="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          # minSdk 24 would skip the V1 check; explicitly verify both signature schemes.
          "$apksigner" verify --min-sdk-version 23 --verbose --print-certs "$apk" | tee signing-verification.txt
          grep -q 'Verified using v1 scheme (JAR signing): true' signing-verification.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' signing-verification.txt
          expected="$(keytool -exportcert -keystore app/zenlauncher.jks -alias zenlauncher -storepass zenlauncher123 | sha256sum | cut -d' ' -f1)"
          actual="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' signing-verification.txt)"
          test "$expected" = "$actual"

      - name: Copy Versioned APK
        env:
          APK_NAME: ${{ steps.version.outputs.apk }}
        run: |
          mkdir -p build_output
          cp app/build/outputs/apk/release/app-release.apk "build_output/$APK_NAME"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZenLauncher-v${{ steps.version.outputs.version }}-native-apk
          path: build_output/${{ steps.version.outputs.apk }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload Verification Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.*
            signing-verification.txt
          if-no-files-found: ignore
          retention-days: 14

  emulator:
    name: Device Navigation (API ${{ matrix.api-level }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api-level: [24, 34]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable and Require KVM
        shell: bash
        run: |
          report_kvm_failure() {
            if [[ -e /dev/kvm ]]; then
              echo "::error title=KVM initialization failed::/dev/kvm is present but KVM setup did not complete. $(ls -l /dev/kvm); $(id)"
            else
              echo "::error title=KVM initialization failed::/dev/kvm does not exist on this runner. $(id)"
            fi
            ls -l /dev/kvm || true
            id
          }
          trap report_kvm_failure ERR
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle --timeout=10
          # Give asynchronous udev permission changes a bounded chance to finish.
          for attempt in {1..10}; do
            if [[ -r /dev/kvm && -w /dev/kvm ]]; then
              exit 0
            fi
            sleep 1
          done
          if [[ -r /dev/kvm && -w /dev/kvm ]]; then
            exit 0
          fi
          echo '::error::KVM is still not readable and writable after the 10-second permission wait; hardware acceleration is required.'
          report_kvm_failure
          exit 1

      - name: Compile Device Tests
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug assembleDebugAndroidTest --stacktrace

      - name: Prepare Device Test Runner and Evidence Capture
        shell: bash
        run: |
          mkdir -p build/emulator-evidence
          cat > build/run-emulator-tests.sh <<'BASH'
          #!/usr/bin/env bash
          set -euo pipefail
          evidence=build/emulator-evidence
          logcat_pid=
          report_runner_failure() {
            local runner_exit=$1 runner_line=$2 failed_command=$3
            failed_command="${failed_command//%/%25}"
            failed_command="${failed_command//$'\n'/%0A}"
            echo "::error title=Emulator test runner command::Line $runner_line exited $runner_exit: $failed_command"
            return "$runner_exit"
          }
          collect_evidence() {
            local status=$?
            trap - EXIT ERR
            set +e
            # Capture while the device is still running; the action stops it on return.
            timeout 15s adb shell dumpsys activity activities > "$evidence/activity.txt" 2>&1
            timeout 15s adb shell dumpsys window windows > "$evidence/window.txt" 2>&1
            timeout 15s adb shell dumpsys window displays > "$evidence/displays.txt" 2>&1
            # Reboot disconnects the original streaming logcat process. Capture
            # the new boot's buffer as well, before the emulator action stops it.
            timeout 15s adb logcat -d -v threadtime > "$evidence/logcat-after-recovery.txt" 2>&1
            # A guest reboot can expose emulator-host failures. Record kernel
            # evidence while the runner is still alive, without restarting ADB/AVD.
            timeout 10s sudo -n dmesg -T 2> "$evidence/kernel-read.log" | grep -Ei 'qemu|emulator|oom|out of memory|killed process|segfault' | tail -n 20 > "$evidence/emulator-kernel.txt"
            if [[ "$status" -ne 0 && -s "$evidence/emulator-kernel.txt" ]]; then
              python3 -c 'import pathlib; s=pathlib.Path("build/emulator-evidence/emulator-kernel.txt").read_text(errors="replace")[-2000:]; print("::notice title=Emulator host kernel evidence::" + s.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))'
            fi
            timeout 15s adb shell dumpsys package com.zenlauncher.app > "$evidence/package.txt" 2>&1
            timeout 15s adb exec-out screencap -p > "$evidence/final-screen.png" 2> "$evidence/screencap.log"
            timeout 15s adb pull /sdcard/Android/data/com.zenlauncher.app/files/screenshots "$evidence/screenshots" > "$evidence/screenshot-pull.log" 2>&1
            if [[ -n "$logcat_pid" ]]; then
              kill "$logcat_pid" 2>/dev/null
              wait "$logcat_pid" 2>/dev/null
            fi
            exit "$status"
          }
          trap collect_evidence EXIT
          trap 'report_runner_failure "$?" "$LINENO" "$BASH_COMMAND"' ERR
          trap 'exit 143' TERM
          trap 'exit 130' INT
          adb logcat -c
          adb logcat -v threadtime > "$evidence/logcat.txt" 2>&1 &
          logcat_pid=$!
          adb shell getprop > "$evidence/device-properties.txt"
          # Querying `emulator -version` also launches a backend and can require
          # GUI libraries. Read the installed SDK metadata without a second process.
          if [[ -r "$ANDROID_HOME/emulator/source.properties" ]]; then
            cp "$ANDROID_HOME/emulator/source.properties" "$evidence/emulator-source.properties"
            emulator_revision="$(sed -n 's/^Pkg.Revision[[:space:]]*=[[:space:]]*//p' "$evidence/emulator-source.properties")"
            echo "::notice title=Emulator runtime::SDK emulator package revision: $emulator_revision"
          fi
          python3 -B scripts/prepare-fresh-emulator.py --output "$evidence/fresh-emulator.json"
          # Set an explicit stock HOME before Gradle installs a second HOME candidate.
          # The instrumentation fixture can then restore a known choice after each test.
          original_home="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["original_home"])' "$evidence/fresh-emulator.json")"
          original_user="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["user"])' "$evidence/fresh-emulator.json")"
          printf '%s\n' "$original_home" > "$evidence/initial-home.txt"
          if [[ ! "$original_home" =~ ^[a-zA-Z0-9_.]+/[a-zA-Z0-9_.$]+$ || "$original_home" == android/* || "$original_home" == com.zenlauncher.app/* ]]; then
            echo '::error::The fresh emulator has no unambiguous stock HOME to restore.'
            exit 1
          fi
          timeout 60s adb shell cmd package set-home-activity --user "$original_user" "$original_home" | tee "$evidence/set-initial-home.txt"
          restored_home="$(adb shell cmd package resolve-activity --brief --user "$original_user" -a android.intent.action.MAIN -c android.intent.category.HOME | tr -d '\r' | tail -n 1)"
          if [[ "$restored_home" != "$original_home" ]]; then
            echo '::error::The emulator did not retain its explicit stock HOME choice.'
            exit 1
          fi
          test_status=0
          sdk="$(adb shell getprop ro.build.version.sdk | tr -d '\r')"
          if [[ "$sdk" == 34 ]]; then
            gesture_args=(-Pandroid.testInstrumentationRunnerArguments.gestures=true)
          elif [[ "$sdk" == 24 ]]; then
            # Android 7 has no platform gestural navigation. Exclude the API 34
            # suite explicitly so every reported test must still execute.
            gesture_args=(-Pandroid.testInstrumentationRunnerArguments.notClass=com.zenlauncher.app.GestureNavigationDeviceTest)
          else
            echo "::error::No navigation test selection is defined for API $sdk."
            exit 1
          fi
          # Installing a new HOME candidate can reset API 24's preferred activity.
          # Pass the verified pre-install choice so the fixture can restore it after install.
          # Keep external-files failure screenshots available for the evidence trap.
          ./gradlew connectedDebugAndroidTest \
            -Pandroid.testInstrumentationRunnerArguments.emulator=true \
            "-Pandroid.testInstrumentationRunnerArguments.originalHome=$original_home" \
            "${gesture_args[@]}" \
            -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true \
            --stacktrace 2>&1 | tee "$evidence/gradle.txt" || test_status=$?
          report_status=0
          python3 build/check-device-results.py "$test_status" "$sdk" || report_status=$?
          # These host-side checks are independent of the touch-gesture suite.
          # Run them even after an instrumentation assertion fails, but only if
          # its fixture really restored the original HOME. Preserve every failure.
          recovery_status=0
          restored_home="$(adb shell cmd package resolve-activity --brief --user "$original_user" -a android.intent.action.MAIN -c android.intent.category.HOME | tr -d '\r' | tail -n 1)"
          if [[ "$restored_home" != "$original_home" ]]; then
            echo '::error::Instrumentation did not restore stock HOME; independent recovery checks cannot start.'
            recovery_status=1
          else
            python3 scripts/verify-home-recovery.py --apk app/build/outputs/apk/debug/app-debug.apk --output build/device-verification/home-recovery.json || recovery_status=$?
          fi
          if [[ "$test_status" -ne 0 ]]; then
            exit "$test_status"
          fi
          if [[ "$report_status" -ne 0 ]]; then
            exit "$report_status"
          fi
          exit "$recovery_status"
          BASH
          cat > build/check-device-results.py <<'PY'
          import pathlib
          import sys
          import xml.etree.ElementTree as ET
          from collections import Counter

          def error(message):
              escaped = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error title=Device navigation verification::{escaped}')

          cases = []
          invalid_reports = False
          for report in pathlib.Path('app/build/outputs/androidTest-results/connected').rglob('*.xml'):
              try:
                  cases.extend(ET.parse(report).getroot().iter('testcase'))
              except ET.ParseError as exc:
                  error(f'Invalid connected test report {report}: {exc}')
                  invalid_reports = True
          failures = 0
          skipped = 0
          for case in cases:
              label = f"{case.get('classname', '?')}.{case.get('name', '?')}"
              for failure in list(case.findall('failure')) + list(case.findall('error')):
                  failures += 1
                  error(f"{label}: {failure.get('message', '')}\n{failure.text or ''}"[:3000])
              if case.find('skipped') is not None:
                  skipped += 1
                  error(f'{label} was skipped; emulator navigation coverage must execute.')
          print(f'Device navigation: {len(cases)} cases, {failures} failures/errors, {skipped} skipped.')
          if not cases:
              error('No connected instrumentation test cases were reported; this is not a passing validation.')
          counts = Counter(case.get('classname', '') for case in cases)
          required = {'HomeNavigationDeviceTest': 9, 'DefaultHomeSelectionDeviceTest': 2}
          if sys.argv[2] == '34':
              required['GestureNavigationDeviceTest'] = 3
          for name, minimum in required.items():
              actual = counts[f'com.zenlauncher.app.{name}']
              if actual < minimum:
                  invalid_reports = True
                  error(f'API {sys.argv[2]} requires at least {minimum} cases from {name}; only {actual} ran.')
          if int(sys.argv[1]) != 0:
              log = pathlib.Path('build/emulator-evidence/gradle.txt')
              tail = log.read_text(errors='replace')[-3000:] if log.exists() else 'Gradle log unavailable.'
              error(f'connectedDebugAndroidTest exited with status {sys.argv[1]}.\n{tail}')
          if cases and not (invalid_reports or failures or skipped) and int(sys.argv[1]) == 0:
              print(f'::notice title=Device navigation coverage::{len(cases)} instrumentation cases executed, 0 failures/errors, 0 skipped.')
          sys.exit(1 if invalid_reports or not cases or failures or skipped else 0)
          PY

      - name: Run Navigation Tests on a KVM Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          emulator-boot-timeout: 300
          disable-linux-hw-accel: false
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none -accel on > '${{ github.workspace }}/build/emulator-evidence/emulator.log' 2>&1
          script: bash build/run-emulator-tests.sh

      - name: Report Emulator Exit Diagnostics
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib
          import re
          path = pathlib.Path('build/emulator-evidence/emulator.log')
          if path.exists():
              lines = [line for line in path.read_text(errors='replace').splitlines()
                       if re.search(r'fatal|error|panic|vcpu|shutdown request|segfault|core dump|killed', line, re.I)]
              if lines:
                  summary = '\n'.join(lines[-20:])[-2500:]
                  escaped = summary.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print(f'::notice title=Emulator process output::{escaped}')
          PY

      - name: Upload Device Test Reports and Failure Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: navigation-api-${{ matrix.api-level }}-evidence
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
            build/emulator-evidence/
            build/device-verification/
          if-no-files-found: warn
          retention-days: 14

  release_upgrade:
    name: Verify the Release APK Upgrade
    needs: build
    uses: ./.github/workflows/verify-release-upgrade.yml
    with:
      candidate_artifact: ZenLauncher-v${{ needs.build.outputs.version }}-native-apk

  release:
    name: Publish Validated Version
    needs: [build, emulator, release_upgrade]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Keep Published Versions Immutable
        id: tag
        env:
          VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Version v$VERSION already has a tag. Keeping that release unchanged; this build is available as a workflow artifact." >> "$GITHUB_STEP_SUMMARY"
          else
            status=$?
            if [ "$status" -ne 2 ]; then
              exit "$status"
            fi
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download Validated APK
        if: steps.tag.outputs.publish == 'true'
        uses: actions/download-artifact@v4
        with:
          name: ZenLauncher-v${{ needs.build.outputs.version }}-native-apk
          path: build_output

      - name: Publish GitHub Release
        if: steps.tag.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: ZenLauncher v${{ needs.build.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            安装包已通过单元测试、Android 7.0 / 14 模拟器导航测试、同签名覆盖升级验证、Android Lint 和统一签名校验（V1 + V2）。
            更新前可在设置中备份配置；使用与此前官方版本相同的签名覆盖安装。

            默认桌面由 Android 系统的 HOME 角色/默认应用设置决定。部分厂商对第三方桌面和全面屏手势另有限制，自动化通过不代表所有设备均已验证。
            设备回归步骤与覆盖记录见 [兼容性验证说明](https://github.com/${{ github.repository }}/blob/${{ github.sha }}/docs/launcher-compatibility.md)。
          files: build_output/${{ needs.build.outputs.apk }}
