name: Build Native Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Native Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Copy & Rename APK
        run: |
          mkdir -p build_output
          cp app/build/outputs/apk/release/app-release.apk build_output/ZenLauncher-v2.1.2-native.apk
          ls -lh build_output/ZenLauncher-v2.1.2-native.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZenLauncher-v2.1.2-native-apk
          path: build_output/ZenLauncher-v2.1.2-native.apk
          retention-days: 14

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.1.2
          name: ZenLauncher v2.1.2 (修复返回键/手势退出至系统桌面与锁屏回跳Bug)
          body: |
            ## 🚀 ZenLauncher v2.1.2 - 核心交互与系统桌面拦截修复

            ### 🐛 缺陷修复与体验优化
            - **彻底修复“返回键/全面屏手势退出至系统桌面”的严重 Bug**：
              - 针对此前用户在桌面按返回键或从侧边滑动返回手势导致 ZenLauncher `finish` 退出、暴露底层系统桌面、进而锁屏解锁后变成系统桌面的问题，全面引入专业级系统桌面返回调度机制。
              - 桌面根视图完全拦截并吞并返回事件，无论如何侧滑返回、按返回键，桌面始终保持驻留，绝不退出到原机系统桌面。
              - 处于搜索状态时，按返回键或侧滑手势优雅自动清空搜索内容并收起键盘，返回最纯净主屏。
            - **深度遵循 AOSP Launcher 系统级任务栈规范**：
              - 声明 `taskAffinity=""`、`resumeWhilePausing="true"`、`excludeFromRecents="true"` 等系统级桌面属性，杜绝被系统多任务误杀或任务栈交错。
              - 完善 `onNewIntent` 响应，按 Home 键或上滑返回桌面瞬间刷新至主屏。
            - **新增主屏幕“默认桌面状态即时提醒与一键引导”**：
              - 若当前未成功设为系统默认桌面，主屏幕顶部以极简卡片轻量提醒，一键直达系统默认桌面设置与防拦截指南；设为默认后自动完全隐藏。

            ### 📥 下载安装
            直接点击下方 **Assets** 列表里的 `ZenLauncher-v2.1.2-native.apk` 下载到手机安装（支持无缝覆盖安装，设置永久保留）。
          files: build_output/ZenLauncher-v2.1.2-native.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
