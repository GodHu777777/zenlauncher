name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Initialize Android Scaffolding & Wrapper
        run: |
          mkdir -p /tmp/backup_src
          cp -r android/app/src/* /tmp/backup_src/
          flutter create . --platforms=android --org=com.zenlauncher
          cp -r /tmp/backup_src/* android/app/src/

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/ZenLauncher-v1.0.1.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZenLauncher-release-apk
          path: build/app/outputs/flutter-apk/ZenLauncher-v1.0.1.apk
          retention-days: 14

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1
          name: ZenLauncher v1.0.1
          body: |
            ## 📱 ZenLauncher 极简防沉迷启动器 v1.0.1
            
            ### ✨ 更新内容
            - 修复并增强不同国产手机（小米/HyperOS、华为、OPPO、vivo 等）系统设置默认桌面的跳转支持。
            - 增加「设为默认桌面」引导指南弹窗。

            ### 🚀 安装指引
            点击下方 **Assets** 列表里的 `ZenLauncher-v1.0.1.apk` 直接下载到手机安装。
          files: build/app/outputs/flutter-apk/ZenLauncher-v1.0.1.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
