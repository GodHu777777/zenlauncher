name: Build Native Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Native Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Copy & Rename APK
        run: |
          mkdir -p build_output
          cp app/build/outputs/apk/release/app-release.apk build_output/ZenLauncher-v2.1.1-native.apk
          ls -lh build_output/ZenLauncher-v2.1.1-native.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZenLauncher-v2.1.1-native-apk
          path: build_output/ZenLauncher-v2.1.1-native.apk
          retention-days: 14

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.1.1
          name: ZenLauncher v2.1.1 (统一签名防冲突 · 应用内更新 · 配置备份恢复)
          body: |
            ## 🚀 ZenLauncher v2.1.1 - 固化官方统一签名，告别卸载，支持无缝覆盖更新！

            ### 🌟 核心问题解决与重磅新特性
            - **彻底根除“签名冲突”历史痛点**：
              - 本次发布引入并固化了官方永久发布密钥库（`zenlauncher.jks`）。
              - GitHub 自动构建、云端编译与本地构建签名 100% 保持一致。
              - **从本次及后续所有版本起，用户可直接点击覆盖安装升级，再也不会提示“签名冲突”，无需先删再装，所有已配置的桌面置顶与防沉迷应用 100% 完整保留！**
            - **应用内“检查更新”与一键升级**：
              - 设置页新增「关于与更新」模块，实时展示当前版本。
              - 点击「检查新版本」可秒级连通 GitHub Releases，支持应用内直接下载并自动拉起系统安装器，一键完成覆盖升级。
            - **配置备份与恢复 (双重安全防线)**：
              - 支持将当前所有置顶应用、冷静应用黑名单、冷静倒计时秒数、专注标语、搜索引擎及日历配置一键导出至剪贴板。
              - 换机或清除数据后，一键粘贴备份字符串即可秒级全量恢复。

            ### 📥 下载安装
            直接点击下方 **Assets** 列表里的 `ZenLauncher-v2.1.1-native.apk` 下载到手机安装。
          files: build_output/ZenLauncher-v2.1.1-native.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
