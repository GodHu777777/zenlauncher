name: Build Native Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Native Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Copy & Rename APK
        run: |
          mkdir -p build_output
          cp app/build/outputs/apk/release/app-release.apk build_output/ZenLauncher-v2.1.0-native.apk
          ls -lh build_output/ZenLauncher-v2.1.0-native.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZenLauncher-v2.1.0-native-apk
          path: build_output/ZenLauncher-v2.1.0-native.apk
          retention-days: 14

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.1.0
          name: ZenLauncher v2.1.0 (极简日程与待办 · 支持 iCloud)
          body: |
            ## 🚀 ZenLauncher v2.1.0 - 极简日程与待办事项 (支持 iCloud)

            ### 🌟 新增功能与体验优化
            - **极简日程待办展示 (纯文本排版)**：
              - 在主屏时钟与专注标语下方优雅展示接下来的 1~3 条日程/待办（如 `• 14:00 - 需求评审` 或 `• 明天 09:30 - 项目汇报`）。
              - 点击任意日程项直接一键唤起系统日历查看详情。
              - 遵循无干扰美学：无日程时自动隐藏，不留空白与杂乱色块。
            - **支持 iCloud 日历与全平台 CalDAV 同步**：
              - 基于 Android 本地系统级 `CalendarContract.Instances` 读取，支持 iCloud（通过免费开源 DAVx⁵ 或系统自带 CalDAV 账号一键无缝同步）。
              - 同时支持 Google Calendar、Exchange/Outlook、飞书日历等任意本地日历。
              - 设置中提供多选日历过滤，可自主选择展示特定日历（如仅展示 iCloud 个人日历，隐藏杂项）。
            - **绝对克制与 0 耗电 / 隐私守护**：
              - **严格可选 (Optional)**：默认完全关闭，不强制索取权限；仅在设置中手动开启时才按需请求权限。
              - **零后台耗电 & 零网络访问**：ZenLauncher 无需网络权限，不轮询，直接由系统本地 Provider 驱动，纯净省电。
              - **隐私安全**：ZenLauncher 不接触 Apple ID 账号与密码，所有数据仅在本地系统安全沙箱内流转。

            ### 📥 下载安装
            直接点击下方 **Assets** 列表里的 `ZenLauncher-v2.1.0-native.apk` 下载到手机安装。
          files: build_output/ZenLauncher-v2.1.0-native.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
