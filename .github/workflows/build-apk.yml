name: Build Native Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Native Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Copy & Rename APK
        run: |
          mkdir -p build_output
          cp app/build/outputs/apk/release/app-release.apk build_output/ZenLauncher-v2.0.1-native.apk
          ls -lh build_output/ZenLauncher-v2.0.1-native.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZenLauncher-v2.0.1-native-apk
          path: build_output/ZenLauncher-v2.0.1-native.apk
          retention-days: 14

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.1
          name: ZenLauncher v2.0.1 (支持应用双开/分身)
          body: |
            ## 🚀 ZenLauncher v2.0.1 - 全面支持应用双开与分身

            ### 🌟 新增功能与体验优化
            - **全面支持应用双开 / 应用分身**：
              - 完美识别并检索微信分身、QQ分身等双开应用。
              - 搜索「微信」或拼音首字母「wx」时，同时列出原微信与微信分身。
              - 原生 `[分身]` 徽章标记，界面干净极简，一眼区分。
              - 支持分身独立置顶至主屏、独立设置防沉迷 5 秒倒计时、独立隐藏与自定义重命名。
            - **深度适配国产 ROM 跨 Profile 机制**：
              - 基于系统级 `LauncherApps` 与 `UserManager` 架构，原生支持小米 HyperOS / MIUI（User 999 XSpace）、华为鸿蒙、OPPO、vivo、三星双开机制。
              - 监听分身创建/移除广播，实时自动刷新桌面。

            ### 📥 下载安装
            直接点击下方 **Assets** 列表里的 `ZenLauncher-v2.0.1-native.apk` 下载到手机安装。
          files: build_output/ZenLauncher-v2.0.1-native.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
