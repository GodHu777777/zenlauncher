name: Build Native Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Native Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Copy & Rename APK
        run: |
          mkdir -p build_output
          cp app/build/outputs/apk/release/app-release.apk build_output/ZenLauncher-v2.1.3-native.apk
          ls -lh build_output/ZenLauncher-v2.1.3-native.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZenLauncher-v2.1.3-native-apk
          path: build_output/ZenLauncher-v2.1.3-native.apk
          retention-days: 14

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.1.3
          name: ZenLauncher v2.1.3 (小米澎湃OS/MIUI/鸿蒙默认桌面设置终极解决方案与锁屏修复)
          body: |
            ## 🚀 ZenLauncher v2.1.3 - 默认桌面全面破局与系统防回跳

            ### 💡 针对“默认应用列表只有系统桌面、无第三方桌面”的终极解决方案
            - **破解小米/鸿蒙等国产 ROM 的全面屏手势限制**：
              - 国产手机系统在开启「全面屏手势」时，系统会故意在默认应用列表中隐藏所有第三方桌面（包括 KISS Launcher、Nova、ZenLauncher 等）。
              - 新增多重一键解决通道：
                1. **一键跳转系统桌面详情页，直接清除默认操作（10秒搞定，推荐度最高，保留全面屏手势）**；
                2. **一键跳转系统导航方式设置，临时切为经典按键即可瞬间在系统设置中显示 ZenLauncher 并设为默认**；
                3. **内置 ADB 内核强制设为默认桌面命令一键复制（完美兼顾全面屏手势与第三方桌面）**。
            
            ### 🐛 锁屏/返回键行为深度修复
            - **桌面根视图完全拦截并消费 Back 键与侧滑手势**：彻底杜绝退出到原厂底层桌面。
            - **AOSP 系统级 Launcher 规范声明**：独立 Task 栈、excludeFromRecents、resumeWhilePausing。

            ### 📥 下载安装
            直接点击下方 **Assets** 列表里的 `ZenLauncher-v2.1.3-native.apk` 下载安装（签名永久一致，无缝覆盖）。
          files: build_output/ZenLauncher-v2.1.3-native.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
